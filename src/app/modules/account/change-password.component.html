<div class="page-container">
  <h2 class="page-title">Account Settings</h2>

  <mat-card class="settings-card">
    <h3>Change Password</h3>
    <mat-form-field appearance="outline" class="full-width">
      <mat-label>Current Password</mat-label>
      <input matInput type="password" [(ngModel)]="currentPassword">
    </mat-form-field>
    <mat-form-field appearance="outline" class="full-width">
      <mat-label>New Password</mat-label>
      <input matInput type="password" [(ngModel)]="newPassword">
    </mat-form-field>
    <mat-form-field appearance="outline" class="full-width">
      <mat-label>Confirm New Password</mat-label>
      <input matInput type="password" [(ngModel)]="confirmPassword">
    </mat-form-field>
    <button mat-raised-button color="primary" (click)="changePassword()" [disabled]="loading">
      {{ loading ? 'Saving…' : 'Change Password' }}
    </button>
    <p class="error" *ngIf="error">{{ error }}</p>
    <p class="success" *ngIf="success">{{ success }}</p>
  </mat-card>

  <mat-card class="settings-card">
    <h3>Recovery Question</h3>
    <p class="hint">Used to reset your password if you forget it. Setting a new one replaces the old answer.</p>
    <mat-form-field appearance="outline" class="full-width">
      <mat-label>Security Question</mat-label>
      <input matInput [(ngModel)]="securityQuestion" placeholder="e.g. What was your first pet's name?">
    </mat-form-field>
    <mat-form-field appearance="outline" class="full-width">
      <mat-label>Answer</mat-label>
      <input matInput [(ngModel)]="securityAnswer">
    </mat-form-field>
    <button mat-raised-button color="primary" (click)="saveSecurityQuestion()" [disabled]="qaLoading">
      {{ qaLoading ? 'Saving…' : 'Save Recovery Question' }}
    </button>
    <p class="error" *ngIf="qaError">{{ qaError }}</p>
    <p class="success" *ngIf="qaSuccess">{{ qaSuccess }}</p>
  </mat-card>
</div>
