<div class="forgot-container">
  <mat-card class="forgot-card">
    <h2>Forgot Password</h2>

    <ng-container *ngIf="step === 1">
      <mat-form-field appearance="outline" class="full-width">
        <mat-label>Username</mat-label>
        <input matInput [(ngModel)]="username" (keyup.enter)="lookupQuestion()">
      </mat-form-field>
      <button mat-raised-button color="primary" class="full-width" (click)="lookupQuestion()" [disabled]="loading">
        {{ loading ? 'Checking…' : 'Continue' }}
      </button>
    </ng-container>

    <ng-container *ngIf="step === 2">
      <p class="question-label">{{ question }}</p>
      <mat-form-field appearance="outline" class="full-width">
        <mat-label>Your Answer</mat-label>
        <input matInput [(ngModel)]="answer" (keyup.enter)="submitReset()">
      </mat-form-field>
      <mat-form-field appearance="outline" class="full-width">
        <mat-label>New Password</mat-label>
        <input matInput type="password" [(ngModel)]="newPassword">
      </mat-form-field>
      <mat-form-field appearance="outline" class="full-width">
        <mat-label>Confirm New Password</mat-label>
        <input matInput type="password" [(ngModel)]="confirmPassword" (keyup.enter)="submitReset()">
      </mat-form-field>
      <button mat-raised-button color="primary" class="full-width" (click)="submitReset()" [disabled]="loading">
        {{ loading ? 'Resetting…' : 'Reset Password' }}
      </button>
    </ng-container>

    <p class="error" *ngIf="error">{{ error }}</p>
    <p class="success" *ngIf="success">{{ success }}</p>

    <a routerLink="/login" class="back-link">Back to login</a>
  </mat-card>
</div>
